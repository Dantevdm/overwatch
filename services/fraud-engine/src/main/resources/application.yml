spring:
  application:
    name: fraud-engine
  task:
    scheduling:
      shutdown:
        # The outbox poller and the rule refresher both run here, and both hold
        # a database transaction while they work. Without this the scheduler is
        # shut down without waiting, so a SIGTERM lands mid-poll and the
        # connection is closed under an open transaction -- which surfaces as
        # "An I/O error occurred while sending to the backend" and a rolled-back
        # batch. Nothing is lost, because an unpublished row is retried, but a
        # clean stop should not need the retry to save it.
        await-termination: true
        await-termination-period: 20s
  lifecycle:
    # This is the one that matters. On SIGTERM the listener container stops
    # polling, finishes the record it is holding, and commits its offset before
    # the context closes. Killed mid-record instead, the offset is never
    # committed and the transaction is redelivered on the next start — which the
    # processor is idempotent about, but "correct because a later safety net
    # catches it" is a worse position than not dropping it in the first place.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overwatch}
    username: ${DB_USER:overwatch}
    password: ${DB_PASSWORD:overwatch}
  flyway:
    enabled: true
    # Migrations live in /database/migration, outside any module, and each
    # service's build copies them onto its classpath — so both services that
    # own a datasource apply the same schema from one source of truth.
    # Concurrent startup is safe: Flyway takes a lock on its schema-history
    # table, so whichever service arrives first migrates and the other waits,
    # then finds nothing to do.
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    listener:
      # The other half of the pair. The listener reads the trace context out of
      # the record's headers and continues the simulator's trace instead of
      # starting a new one, so "published, consumed, evaluated, alerted" is one
      # waterfall rather than four unrelated spans.
      observation-enabled: true
    template:
      # The outbox publisher sends through a KafkaTemplate too, so this is what
      # attaches the publish to the trace that raised the alert.
      observation-enabled: true
    consumer:
      group-id: fraud-engine
      auto-offset-reset: earliest
      # Both deserializers are wrapped in ErrorHandlingDeserializer, which is not
      # decoration. Deserialization happens BEFORE the listener method is called,
      # so a try/catch inside the listener cannot see a malformed message — the
      # container just fails, rewinds, and retries the same poison record
      # forever, which presents as a pipeline that has silently stopped.
      # Wrapped, a bad record surfaces as a null payload the listener can log and
      # skip, and the partition keeps moving.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.overwatch.common.domain
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.overwatch.common.domain.Transaction
    producer:
      # Both serialisers are overridden in OutboxKafkaConfig, which is the only
      # producer this service has: everything it publishes comes out of the
      # outbox as stored JSON text, and handing text to a JSON serialiser would
      # publish a quoted string containing the document. Every other producer
      # property set here — bootstrap servers, acks, anything added later — is
      # still inherited by that factory.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8082
  shutdown: graceful

overwatch:
  engine:
    # How often the engine re-reads rule configuration from the database. Rules are
    # data, so a threshold change takes effect within this window — no redeploy.
    rule-refresh-seconds: 30
  outbox:
    # How long an alert waits between committing and reaching the topic. This is
    # the latency the outbox buys its atomicity with, and it is the number to
    # move if that trade ever looks wrong: lower it and the poller spends more
    # time asking an empty table, raise it and downstream hears later.
    poll-millis: 200
    # Rows per poll. At 200ms this drains 500/s, comfortably above anything the
    # simulator produces, so the backlog gauge stays at zero unless something is
    # actually wrong -- which is what makes it worth alerting on.
    batch-size: 100
    # How long a published row is kept before pruning. Long enough to answer
    # "was this alert published, and when" during a demo; short enough that the
    # outbox stays a queue rather than becoming a second copy of every alert.
    retention-minutes: 60
# Actuator: health for compose orchestration, prometheus for scraping.
# Only what is needed is exposed — this is not "expose: *".
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Export Prometheus histogram buckets for HTTP timings, not just count and
      # sum. Spring publishes http.server.requests as a plain timer by default,
      # which gives an average and nothing else — and the Grafana latency panels
      # call histogram_quantile() over _bucket series, so without this they read
      # "No data". An average request time hides exactly the tail you care about.
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

  # Tracing. A transaction crosses the simulator, a broker and the engine, and
  # three sets of metrics cannot show that as one thing.
  #
  # The exporter is pointed at Tempo by OTLP_ENDPOINT, which compose sets. Left
  # unset — running a service outside the stack — the default below is where
  # Tempo sits if you are running one; if you are not, the exporter fails to
  # connect and says so rather than failing the service. Tracing is diagnostics,
  # and diagnostics must not be able to take down the thing they diagnose.
  otlp:
    metrics:
      export:
        # Metrics stay on the Prometheus scrape. The OpenTelemetry starter
        # brings micrometer-registry-otlp with it, which otherwise pushes
        # metrics to an OTLP endpoint as well — two paths for the same numbers,
        # and a stack trace every step interval when nothing is listening on
        # the second one. Traces are pushed; metrics are pulled.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # management.opentelemetry.tracing.*, not management.otlp.tracing.*.
          # Boot 4 moved these, and the old names are not an error — they are
          # simply unbound, so the exporter keeps its default endpoint and the
          # service starts, logs nothing, and sends no span anywhere. Worth
          # knowing because it is indistinguishable from tracing being off.
          endpoint: ${OTLP_ENDPOINT:http://localhost:4317}
          # The default transport is http, which would mean posting to
          # :4318/v1/traces. Tempo here listens on gRPC only — one open port
          # rather than two, and the exporter picks the one that is there.
          transport: grpc
  tracing:
    sampling:
      # Every trace. Not a production setting — at real volume this is the line
      # to lower, which is why it is a property and not a constant — but at a
      # few transactions a second the storage is trivial, and a sampled-out
      # trace is always the one the reviewer asked about.
      probability: 1.0
