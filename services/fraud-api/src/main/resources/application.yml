spring:
  application:
    name: fraud-api
  lifecycle:
    # The grace period for `shutdown: graceful` below. Long enough for a slow
    # dashboard query to finish; short enough that a restart is a restart and
    # not a wait. Compose gives the container 30s before SIGKILL, so this has
    # to stay under that or graceful shutdown is a promise the runtime breaks.
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overwatch}
    username: ${DB_USER:overwatch}
    password: ${DB_PASSWORD:overwatch}
  flyway:
    enabled: true
    # Migrations live in /database/migration, outside any module, and each
    # service's build copies them onto its classpath — so both services that
    # own a datasource apply the same schema from one source of truth.
    # Concurrent startup is safe: Flyway takes a lock on its schema-history
    # table, so whichever service arrives first migrates and the other waits,
    # then finds nothing to do.
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    # This service runs no listener. The consumer settings exist so the Streams
    # page can peek at recent messages: it assigns partitions explicitly and
    # seeks, so no group is joined and no offset is ever committed — peeking at a
    # topic must not move the engine's position in it.
    consumer:
      group-id: fraud-api-peek
      enable-auto-commit: false
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Deliberately raw. The engine deserialises into Transaction because it acts
      # on the fields; this page shows the reviewer the bytes that are actually on
      # the topic, and a typed view would quietly repair a payload the pipeline
      # would have rejected.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # A string serializer, not a JSON one. Both stream operations publish bytes
      # that already exist: the JSON a reviewer typed on the page, or a message
      # read back off the topic. Serialising a String through JsonSerializer would
      # quote and escape it, so what landed on the topic would not be what was
      # shown — and a re-delivery has to be byte-identical to prove anything.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080
  # In-flight HTTP requests finish before the connector closes. Without this a
  # `docker compose restart` answers a request that was mid-query with a reset
  # connection, and the dashboard shows a failed panel for something that was
  # working.
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

overwatch:
  api:
    # The dashboard is served from a different origin in development.
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    # The simulator's control API, proxied under /api/simulator so the dashboard
    # stays on one origin and the simulator needs no published port.
    simulator-url: ${SIMULATOR_URL:http://localhost:8081}
    # POST /api/admin/reset clears transactions, alerts and rule hits so a demo
    # can start from zero. On by default because that is what this stack is for,
    # and there is no point shipping a reset button that needs a config change to
    # work. It is a flag rather than a hardcoded true because the endpoint
    # destroys data and nothing here authenticates: this is the one line a real
    # deployment sets to false, and the first route that should demand a role once
    # the BFF grows authentication.
    allow-reset: ${ALLOW_RESET:true}
    # The Streams page can publish to the transactions topic: one hand-written
    # transaction, or a verbatim re-delivery of recent messages to demonstrate
    # that the engine's idempotency guard holds. Both write to the pipeline's
    # input, so they get the same treatment as reset — a flag, on for the demo,
    # one line for a deployment that wants the page read-only.
    allow-stream-writes: ${ALLOW_STREAM_WRITES:true}
# Actuator: health for compose orchestration, prometheus for scraping.
# Only what is needed is exposed — this is not "expose: *".
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Export Prometheus histogram buckets for HTTP timings, not just count and
      # sum. Spring publishes http.server.requests as a plain timer by default,
      # which gives an average and nothing else — and the Grafana latency panels
      # call histogram_quantile() over _bucket series, so without this they read
      # "No data". An average request time hides exactly the tail you care about.
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
