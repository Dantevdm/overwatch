spring:
  application:
    name: fraud-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overwatch}
    username: ${DB_USER:overwatch}
    password: ${DB_PASSWORD:overwatch}
  flyway:
    enabled: true
    # Migrations ship in the common module, so both services that own a
    # datasource apply the same schema from one source of truth. Concurrent
    # startup is safe: Flyway takes a lock on its schema-history table, so
    # whichever service arrives first migrates and the other waits, then finds
    # nothing to do.
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: fraud-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.overwatch.common.domain
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.overwatch.common.domain.Transaction
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

overwatch:
  engine:
    # How often the engine re-reads rule configuration from the database. Rules are
    # data, so a threshold change takes effect within this window — no redeploy.
    rule-refresh-seconds: 30
# Actuator: health for compose orchestration, prometheus for scraping.
# Only what is needed is exposed — this is not "expose: *".
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
