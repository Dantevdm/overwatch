# Overwatch — full stack.
#
#   docker compose up
#
# Health checks and `service_healthy` conditions matter here: without them the
# engine races Postgres and Redpanda on a cold start and crash-loops until they
# happen to be ready. With them, `up` works first try on a machine that has never
# seen this repo.

name: overwatch

services:

  # ---- infrastructure -------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: ow-postgres
    environment:
      POSTGRES_DB: overwatch
      POSTGRES_USER: overwatch
      POSTGRES_PASSWORD: overwatch
    # No host binding. Only the engine and API talk to Postgres, and they do so
    # over the compose network. docker-compose.tools.yml exposes it for DBeaver.
    volumes:
      # Schema is owned by Flyway, not by entrypoint init scripts — migrations
      # then run identically on a fresh volume, an existing one, and in CI.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overwatch -d overwatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: ow-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      # Two listeners: 'internal' for containers on the compose network,
      # 'external' for tools running on the host.
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    # No host binding. Services reach the broker over the compose network as
    # redpanda:9092. Use docker-compose.tools.yml to expose it to host tooling.
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Redpanda Console — the broker's own web UI.
  #
  # Worth a container because the streaming step is the one part of this pipeline
  # you otherwise have to take on faith: transactions go into a topic and alerts
  # come out, and without this there is nothing to look at in between. Here you
  # can read the actual JSON on `transactions` and `fraud-alerts`, see the
  # partitions, and watch the engine's consumer group lag move.
  #
  # Read-only by default: no topic creation or deletion, no message publishing.
  # It is a window onto the broker for a demonstration, not an admin console, and
  # nothing here authenticates.
  redpanda-console:
    # Upstream, plus a git binary — see the Dockerfile for why that is needed.
    build:
      context: ./infra/observability/redpanda-console
    container_name: ow-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONFIG_FILEPATH: /etc/console/console.yaml
    volumes:
      - ./infra/observability/redpanda-console/console.yaml:/etc/console/console.yaml:ro
      # The repository itself, read-only, so the console can serve the per-topic
      # documentation under infra/observability/redpanda-console/topic-docs.
      # This version has no filesystem source for those docs — git only — so it
      # clones from a local path. Read-only, no credentials, nothing leaves the
      # machine. See console.yaml.
      - .:/repo:ro
    ports:
      - "${OW_CONSOLE_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ---- application ----------------------------------------------------------

  fraud-engine:
    build:
      # One shared builder stage across all three services — see ./Dockerfile.
      context: .
      dockerfile: Dockerfile
      target: fraud-engine
    container_name: ow-fraud-engine
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/overwatch
      DB_USER: overwatch
      DB_PASSWORD: overwatch
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # No host binding. Prometheus scrapes fraud-engine:8082 inside the network,
    # and nothing else needs to reach it.
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  fraud-api:
    build:
      # One shared builder stage across all three services — see ./Dockerfile.
      context: .
      dockerfile: Dockerfile
      target: fraud-api
    container_name: ow-fraud-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/overwatch
      DB_USER: overwatch
      DB_PASSWORD: overwatch
      CORS_ORIGINS: http://localhost:5173
      # The simulator publishes no host port; its controls reach the dashboard
      # through this service instead.
      SIMULATOR_URL: http://transaction-simulator:8081
      # Not for a listener — this service consumes nothing. The Streams page
      # needs the broker for topic and consumer-group metadata, for reading the
      # tail of a topic, and for its two publish operations.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports:
      - "${OW_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Waited on rather than assumed. The AdminClient connects lazily, so this
      # service starts either way — but starting it before the broker means the
      # first look at the Streams page is an error message.
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  transaction-simulator:
    build:
      # One shared builder stage across all three services — see ./Dockerfile.
      context: .
      dockerfile: Dockerfile
      target: transaction-simulator
    container_name: ow-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # No host binding. Prometheus scrapes transaction-simulator:8081 inside the
    # network.
    depends_on:
      redpanda:
        condition: service_healthy
      # Start producing only once there is something to consume the stream.
      fraud-engine:
        condition: service_healthy
    # This service is the last thing in the stack to become useful — it waits on
    # the engine, then boots Spring, then connects a producer — and without a
    # health check nothing could observe that. `docker compose up -d` returned
    # while it was still starting, so CI's smoke test asserted against a
    # simulator that was not yet serving and reported six failures with one
    # cause. A service whose readiness something else depends on needs a health
    # check, even when nothing scrapes it from the host.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  overwatch-ui:
    build:
      context: ./overwatch-ui
    container_name: ow-ui
    environment:
      # Proxy target for the Vite dev server, resolved INSIDE this container —
      # so it is a compose hostname, not a host port. Do not confuse it with
      # VITE_API_PUBLIC_URL below: pointing this at localhost breaks every API
      # call in the app, because localhost inside this container is this
      # container.
      VITE_API_URL: http://fraud-api:8080
      # Browser-side URL, so this is a host port rather than a compose hostname:
      # the iframe is loaded by the reviewer's browser, which cannot resolve
      # "grafana". Follows the preflight override so a reassigned Grafana port
      # still frames correctly.
      VITE_GRAFANA_URL: http://localhost:${OW_GRAFANA_PORT:-3000}
      # The rest of the stack's own web UIs, linked from the sidebar. Same
      # reasoning: browser-side URLs, following any preflight reassignment, so
      # the links work rather than pointing at a port the stack is not on.
      VITE_PROMETHEUS_URL: http://localhost:${OW_PROMETHEUS_PORT:-9090}
      VITE_CONSOLE_URL: http://localhost:${OW_CONSOLE_PORT:-8090}
      # The API as the *browser* reaches it, for the Swagger link. Deliberately
      # a different name from VITE_API_URL above, which the dev server resolves
      # inside the container.
      VITE_API_PUBLIC_URL: http://localhost:${OW_API_PORT:-8080}
    ports:
      - "${OW_UI_PORT:-5173}:5173"
    volumes:
      # The source, bind-mounted. This container's command is `npm run dev`, so
      # it was already a development server — baking the source into the image
      # only meant every UI change cost an image rebuild, and a `compose restart`
      # silently kept serving the old bundle. Mounted, Vite's HMR picks edits up.
      - ./overwatch-ui:/app
      # An anonymous volume over node_modules, so the host directory cannot
      # shadow it. The dependencies are installed inside the image for the
      # container's platform; letting the mount hide them means the app runs
      # against whatever the host happens to have there, or nothing at all.
      - /app/node_modules
    depends_on:
      - fraud-api
    restart: unless-stopped

  # ---- observability --------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ow-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    ports:
      - "${OW_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ow-grafana
    environment:
      # Anonymous viewer access: this is a demo stack, and a login wall between the
      # reviewer and the dashboards serves nobody.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Let the dashboard's Metrics page frame these dashboards. Grafana refuses
      # to be framed by default (X-Frame-Options: deny), which is the right
      # default for an authenticated Grafana on a real network — the risk is
      # clickjacking a logged-in admin. It costs nothing here: anonymous access
      # is already on by the decision above, so framing exposes no capability
      # that opening localhost:3000 in a tab does not already grant.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline-health.json
    ports:
      - "${OW_GRAFANA_PORT:-3000}:3000"
    volumes:
      # Provisioning: datasource and dashboards exist on first boot, no imports.
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  redpanda-data:
  prometheus-data:
  grafana-data:
