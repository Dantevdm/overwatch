# Loki, provisioned alongside Prometheus so logs are one click from the metric
# that made you want them.
apiVersion: 1

datasources:
  - name: Loki
    # A stable uid for the same reason Prometheus has one: the logs dashboard
    # names it explicitly rather than relying on which datasource happens to be
    # default, so adding a third datasource cannot silently rebind every panel.
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Cap what one panel can pull back. A logs panel with no limit against a
      # busy stack will happily try to render a hundred thousand lines and hang
      # the browser tab, which reads as "the dashboard is broken".
      maxLines: 2000
      # From a log line to its trace.
      #
      # This is the payoff for the tracing work: an ERROR in the log panel
      # carries the trace id of the request that produced it, and this turns
      # that id into a link. Without it a reader has the id and has to go and
      # paste it into another tab, which is the same as not having it.
      #
      # The pattern matches the correlation field Spring Boot 4 adds to its
      # console pattern once tracing is on — [traceId-spanId], 32 hex and 16 —
      # and captures the trace. Anchored on those lengths so it cannot match
      # the padded blank bracket a line logged outside a span carries.
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '\[([a-f0-9]{32})-[a-f0-9]{16}\]'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: 'View trace'
