# Tempo, and the link from a log line to the trace it belongs to.
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # From a trace, back to the logs it produced. Grafana matches on the
      # service name, because that is the label the log pipeline actually has —
      # matching on trace id would be tighter and requires trace_id to be a Loki
      # label, which would make one stream per trace and is the textbook way to
      # ruin a Loki.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service
        filterByTraceID: true
        filterBySpanID: false
      # From a trace, to the metrics of the service that produced it.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -2m
        spanEndTimeShift: 2m
        tags:
          - key: service.name
            value: service
      # The service graph and span metrics are deliberately off: both are
      # generated by a metrics-generator this Tempo does not run, and switching
      # them on here produces two tabs that load forever and explain nothing.
      nodeGraph:
        enabled: false
