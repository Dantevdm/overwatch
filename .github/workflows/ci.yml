name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:

  # ---------------------------------------------------------------------------
  # Compile, test, and enforce the quality gate.
  # ---------------------------------------------------------------------------
  build:
    name: Build & quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # action-junit-report publishes the test results as a check run, which needs
    # checks: write. Without this block the job gets only the repository's
    # default token scopes, and the step failed with "Resource not accessible by
    # integration" — an annotation error on an otherwise green build, so the
    # tests ran and passed and simply were not published anywhere.
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # `verify` is deliberately the entire gate: tests, the JaCoCo coverage
      # floor, SpotBugs with find-sec-bugs, and PMD all bind to that phase. If
      # this passes, the identical command passes on a developer machine.
      - name: mvn verify
        run: mvn -B --no-transfer-progress clean verify

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          include_passed: true
          detailed_summary: true

      - name: Upload coverage and analysis reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quality-reports
          path: |
            **/target/site/jacoco/
            **/target/spotbugsXml.xml
            **/target/pmd.xml
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo "Raw JaCoCo figures, over _every_ class in each module. The"
            echo "coverage gate measures a narrower set — it excludes JPA"
            echo "entities, DTOs, config and the Application classes, which are"
            echo "declarations rather than behaviour — so the gated percentage"
            echo "is higher than the one below and is the one that fails the"
            echo "build. \`common\` reads low here and is at 96.6% gated,"
            echo "because most of its lines are entity accessors."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for csv in $(find . -name jacoco.csv); do
            # The directory immediately above target/, whatever its depth.
            # This was `cut -d/ -f2`, which was correct while the modules sat at
            # the repository root and silently became "services" for every one
            # of them when they moved under services/ — five identical labels
            # against five different numbers.
            module=$(echo "$csv" | sed 's|.*/\([^/]*\)/target/.*|\1|')
            # JaCoCo CSV: column 8 is LINE_MISSED, 9 is LINE_COVERED. Columns
            # 4 and 5 are instructions — a different, always more flattering
            # number, and not the one the coverage gate enforces.
            awk -F, -v m="$module" '
              NR > 1 { missed += $8; covered += $9 }
              END {
                if (missed + covered > 0)
                  printf "- **%s**: %.1f%% lines (%d/%d)\n", m,
                         covered * 100 / (missed + covered), covered, missed + covered
              }' "$csv" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------
  # Apply the Flyway migrations to a real PostgreSQL and assert the outcome.
  # Catches a broken migration before it reaches anyone.
  # ---------------------------------------------------------------------------
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: overwatch
          POSTGRES_USER: overwatch
          POSTGRES_PASSWORD: overwatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U overwatch -d overwatch"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations in order
        env:
          PGPASSWORD: overwatch
        run: |
          set -euo pipefail
          for f in infra/database/migration/V*.sql; do
            echo "==> $f"
            psql -h localhost -U overwatch -d overwatch -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Assert the schema is what we expect
        env:
          PGPASSWORD: overwatch
        run: |
          set -euo pipefail
          q() { psql -h localhost -U overwatch -d overwatch -t -A -c "$1"; }

          tables=$(q "SELECT COUNT(*) FROM pg_tables WHERE schemaname='public';")
          rules=$(q  "SELECT COUNT(*) FROM fraud_rules;")
          shadow=$(q "SELECT COUNT(*) FROM fraud_rules WHERE state='SHADOW';")

          echo "tables=$tables rules=$rules shadow=$shadow"
          [ "$tables" -eq 5 ] || { echo "expected 5 tables, got $tables"; exit 1; }
          [ "$rules"  -ge 7 ] || { echo "expected >=7 seeded rules, got $rules"; exit 1; }
          [ "$shadow" -ge 1 ] || { echo "expected a rule shipped in SHADOW"; exit 1; }

          # Constraints must actually reject bad data. A CHECK that never fires
          # is worse than no CHECK, because it reads as protection.
          if psql -h localhost -U overwatch -d overwatch -q -c \
             "INSERT INTO fraud_rules (rule_type,name,weight) VALUES ('X','over',1.5);" 2>/dev/null; then
            echo "weight constraint did not reject 1.5"; exit 1
          fi

          # One alert per transaction (V3). This is the invariant that stops a
          # Kafka redelivery double-counting an analyst's figures, and it is
          # enforced here rather than only in the engine because two engine
          # instances can both pass an application check for the same record.
          psql -h localhost -U overwatch -d overwatch -q -v ON_ERROR_STOP=1 -c \
            "INSERT INTO transactions (id,card_id,amount,merchant_name,merchant_category,country_code,channel,occurred_at)
             VALUES ('11111111-1111-1111-1111-111111111111','C1',100,'M','groceries','ZA','POS',now());
             INSERT INTO fraud_alerts (id,transaction_id,risk_score,severity,status,amount,currency,occurred_at)
             VALUES ('22222222-2222-2222-2222-222222222222','11111111-1111-1111-1111-111111111111',0.5,'MEDIUM','OPEN',100,'ZAR',now());"

          if psql -h localhost -U overwatch -d overwatch -q -c \
             "INSERT INTO fraud_alerts (id,transaction_id,risk_score,severity,status,amount,currency,occurred_at)
              VALUES ('33333333-3333-3333-3333-333333333333','11111111-1111-1111-1111-111111111111',0.5,'MEDIUM','OPEN',100,'ZAR',now());" 2>/dev/null; then
            echo "a second alert for one transaction was accepted"; exit 1
          fi

          # rule_id is nullable, and the default UNIQUE treats every NULL as
          # distinct — which would leave exactly the duplicates the constraint
          # exists to prevent. V3 uses NULLS NOT DISTINCT; prove it.
          psql -h localhost -U overwatch -d overwatch -q -v ON_ERROR_STOP=1 -c \
            "INSERT INTO shadow_rule_hits (transaction_id,rule_id,rule_type,weight,reason)
             VALUES ('11111111-1111-1111-1111-111111111111',NULL,'ADHOC',0.1,'r');"
          if psql -h localhost -U overwatch -d overwatch -q -c \
             "INSERT INTO shadow_rule_hits (transaction_id,rule_id,rule_type,weight,reason)
              VALUES ('11111111-1111-1111-1111-111111111111',NULL,'ADHOC',0.1,'r');" 2>/dev/null; then
            echo "a duplicate NULL-rule shadow hit was accepted"; exit 1
          fi

          echo "Schema and constraints verified."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify entity mappings against the schema
        env:
          PGPASSWORD: overwatch
        run: |
          # Hibernate runs ddl-auto: validate, so an entity that disagrees with
          # the migration stops the service at startup — one mismatched column
          # at a time, minutes apart. This reports all of them at once, here.
          pip install --quiet psycopg2-binary
          ./scripts/verify-schema-mapping.py \
            --dsn "postgresql://overwatch:overwatch@localhost:5432/overwatch"

  # ---------------------------------------------------------------------------
  # Build the images and run the whole stack, then smoke-test it. This is the
  # job that catches packaging and wiring faults a unit test never will.
  # ---------------------------------------------------------------------------
  stack:
    name: Docker stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: docker compose build

      # --wait blocks until every service with a health check reports healthy,
      # and fails the step if one never does. Without it `up -d` returns as soon
      # as the containers are created, so the smoke test below started asserting
      # against a stack that was still booting — which is exactly how this job
      # came to report six failures with one cause.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # A Grafana panel whose query returns nothing renders as "No data", which
      # is indistinguishable from a metric that is simply quiet — so a broken
      # dashboard is invisible in a way a broken endpoint is not. This runs every
      # panel's query against the live Prometheus and fails on the empty ones.
      - name: Verify dashboard queries return data
        run: ./scripts/verify-dashboards.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
