# Optional overlay: publishes the internal services to the host.
#
# The base stack keeps Postgres, Redpanda, the engine and the simulator inside
# the compose network, because nothing outside it needs them — Prometheus
# scrapes over Docker DNS. That keeps the host port surface to the four things
# a person actually opens.
#
# Use this overlay when you want to point external tooling at them: DBeaver at
# Postgres, rpk or Postman at Kafka, or curl at a service's actuator directly.
#
#   docker compose -f docker-compose.yml -f docker-compose.tools.yml up
#   make up-tools
#
# Every port is overridable, same as the base stack.

services:
  postgres:
    ports:
      - "${OW_PG_PORT:-5432}:5432"

  redpanda:
    ports:
      - "${OW_KAFKA_PORT:-19092}:19092"

  fraud-engine:
    ports:
      - "${OW_ENGINE_PORT:-8082}:8082"

  transaction-simulator:
    ports:
      - "${OW_SIMULATOR_PORT:-8081}:8081"

  loki:
    ports:
      # For curling LogQL directly:
      #   curl -sG localhost:3100/loki/api/v1/query_range \
      #     --data-urlencode 'query={service="fraud-engine"} |= "ERROR"'
      - "${OW_LOKI_PORT:-3100}:3100"

  alloy:
    ports:
      # Alloy's own UI, at /graph — shows each component's state and how many
      # targets it discovered, which is the first place to look when a service's
      # logs are missing from the dashboard.
      - "${OW_ALLOY_PORT:-12345}:12345"

  tempo:
    ports:
      # Tempo's API, for querying a trace by id without Grafana:
      #   curl -s localhost:3200/api/traces/<traceid>
      - "${OW_TEMPO_PORT:-3200}:3200"
