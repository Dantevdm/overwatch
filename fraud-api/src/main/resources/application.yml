spring:
  application:
    name: fraud-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overwatch}
    username: ${DB_USER:overwatch}
    password: ${DB_PASSWORD:overwatch}
  flyway:
    enabled: true
    # Migrations ship in the common module, so both services that own a
    # datasource apply the same schema from one source of truth. Concurrent
    # startup is safe: Flyway takes a lock on its schema-history table, so
    # whichever service arrives first migrates and the other waits, then finds
    # nothing to do.
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

overwatch:
  api:
    # The dashboard is served from a different origin in development.
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
    # The simulator's control API, proxied under /api/simulator so the dashboard
    # stays on one origin and the simulator needs no published port.
    simulator-url: ${SIMULATOR_URL:http://localhost:8081}
# Actuator: health for compose orchestration, prometheus for scraping.
# Only what is needed is exposed — this is not "expose: *".
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
