spring:
  application:
    name: fraud-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/overwatch}
    username: ${DB_USER:overwatch}
    password: ${DB_PASSWORD:overwatch}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

overwatch:
  api:
    # The dashboard is served from a different origin in development.
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
# Actuator: health for compose orchestration, prometheus for scraping.
# Only what is needed is exposed — this is not "expose: *".
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
